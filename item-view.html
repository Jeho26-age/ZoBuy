<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zobuy | Product View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fff; color: #000; padding-bottom: 100px; }
        
        /* Layout Components */
        .top-nav { position: fixed; top: 0; width: 100%; height: 60px; background: #fff; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #f5f5f5; }
        .hero-section { width: 100%; padding-top: 60px; background: #fafafa; position: relative; }
        #main-img { width: 100%; height: auto; max-height: 400px; object-fit: contain; display: block; }

        /* Branding - Your Polygon Tag */
        .discount-tag {
            position: absolute; top: 75px; left: 0; background: #ff5252; color: white;
            font-size: 10px; font-weight: 900; padding: 5px 12px 5px 18px;
            clip-path: polygon(100% 0%, 85% 50%, 100% 100%, 0% 100%, 0% 0%); z-index: 10;
        }

        /* Pricing - Black New / Red Old */
        .price-now { color: #000; font-weight: 900; font-size: 26px; }
        .price-was { color: #000; text-decoration: line-through; text-decoration-color: #ff5252; font-size: 16px; margin-left: 8px; opacity: 0.6; }

        /* Action Buttons */
        .footer-actions { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; z-index: 2000; }
        .btn-cart { flex: 1; border: 1.5px solid #000; border-radius: 12px; font-weight: 700; text-transform: uppercase; font-size: 12px; height: 55px; display: flex; align-items: center; justify-content: center; }
        .btn-buy { flex: 1.5; background: #000; color: #fff; border-radius: 12px; font-weight: 700; text-transform: uppercase; font-size: 12px; height: 55px; display: flex; align-items: center; justify-content: center; }
        
        /* Store Lock Message */
        #locked-msg { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; color: #888; padding: 20px; text-align: center; font-weight: 800; display: none; z-index: 2001; }
        
        .similar-item img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f9f9f9; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <button onclick="history.back()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <div class="font-black tracking-tighter text-lg uppercase">Zobuy</div>
        <div class="w-6"></div> </nav>

    <div class="hero-section">
        <div id="save-badge" class="discount-tag">SAVE ₹0</div>
        <img id="main-img" src="https://via.placeholder.com/500" alt="Product">
    </div>

    <main class="p-5">
        <p id="store-name" class="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-1">Store Name</p>
        <h1 id="item-title" class="text-xl font-bold mb-3 leading-tight">Product Title Loading...</h1>
        
        <div class="flex items-center mb-6">
            <span id="price-current" class="price-now">₹0</span>
            <span id="price-original" class="price-was">₹0</span>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl mb-8">
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Description</p>
            <p id="item-desc" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">---</p>
        </div>

        <h3 class="font-bold text-sm mb-4">Recommended for you</h3>
        <div id="similar-box" class="grid grid-cols-3 gap-3">
            </div>
    </main>

    <div id="action-dock" class="footer-actions">
        <div class="btn-cart" onclick="addToCart()">Add to cart</div>
        <div class="btn-buy" onclick="handleBuyNow()">Buy Now</div>
    </div>

    <div id="locked-msg">STORE IS CURRENTLY CLOSED</div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('id');
        let currentUser = null;

        // Auth Monitor
        firebase.auth().onAuthStateChanged(user => {
            currentUser = user;
        });

        async function loadPage() {
            if(!pid) return window.location.href = "homepage.html";

            const doc = await db.collection("products").doc(pid).get();
            if(!doc.exists) return;
            const data = doc.data();

            // Store Lock Check
            const seller = await db.collection("seller_settings").doc(data.sellerId).get();
            if(seller.exists && seller.data().isLocked) {
                document.getElementById('action-dock').style.display = 'none';
                document.getElementById('locked-msg').style.display = 'block';
            }

            // UI Data Mapping
            document.getElementById('main-img').src = data.imageURL;
            document.getElementById('item-title').innerText = data.name;
            document.getElementById('item-desc').innerText = data.description;
            
            const salePrice = data.price - (data.discount || 0);
            document.getElementById('price-current').innerText = "₹" + salePrice;
            
            if(data.discount > 0) {
                document.getElementById('price-original').innerText = "₹" + data.price;
                document.getElementById('save-badge').innerText = "SAVE ₹" + data.discount;
            } else {
                document.getElementById('price-original').style.display = 'none';
                document.getElementById('save-badge').style.display = 'none';
            }

            // Store Info
            const store = await db.collection("users").doc(data.sellerId).get();
            document.getElementById('store-name').innerText = store.data()?.storeName || "Vendor";

            fetchSimilar(data.sellerId);
        }

        async function fetchSimilar(sid) {
            const snap = await db.collection("products").where("sellerId", "==", sid).limit(4).get();
            let html = '';
            snap.forEach(d => {
                if(d.id !== pid) {
                    html += `
                        <a href="item-view.html?id=${d.id}" class="similar-item">
                            <img src="${d.data().imageURL}">
                            <p class="text-[9px] font-bold mt-1 truncate">${d.data().name}</p>
                        </a>
                    `;
                }
            });
            document.getElementById('similar-box').innerHTML = html;
        }

        function handleBuyNow() {
            if(!currentUser) {
                // Save target product and redirect to signin
                sessionStorage.setItem('pendingBuy', pid);
                alert("Please sign in to complete your purchase");
                window.location.href = "signin.html";
            } else {
                window.location.href = `check_out.html?id=${pid}`;
            }
        }

        function addToCart() {
            // Basic LocalStorage Cart Logic
            let cart = JSON.parse(localStorage.getItem('zobuy_cart') || "[]");
            cart.push({id: pid, name: document.getElementById('item-title').innerText});
            localStorage.setItem('zobuy_cart', JSON.stringify(cart));
            alert("Added to cart!");
        }

        loadPage();
    </script>
</body>
</html>
