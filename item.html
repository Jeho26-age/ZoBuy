<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asset Intake | Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8f9fa; 
            color: #1a1a1a; 
            margin: 0;
            padding: 0;
        }

        .admin-header {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            color: #1a1a1a;
            transition: opacity 0.2s;
        }
        .back-nav:hover { opacity: 0.6; }
        .back-arrow { font-size: 24px; font-weight: 400; }

        .category-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .category-card:hover {
            border-color: #000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        .category-image {
            width: 100%;
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
            background-color: #f3f4f6;
        }
        .category-label {
            padding: 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .form-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .input-pro {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-pro:focus {
            border-color: #000;
            background: #fdfdfd;
        }

        .media-upload-box {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.2s;
        }
        .media-upload-box:hover {
            border-color: #000;
            color: #000;
            background: #f9fafb;
        }

        .btn-primary {
            background: #000;
            color: #fff;
            width: 100%;
            padding: 18px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="flex items-center gap-6">
            <a href="store.html" class="back-nav">
                <span class="back-arrow">←</span>
            </a>
            <div>
                <h1 class="text-xl font-800 tracking-tight">Inventory Node</h1>
                <p class="text-[10px] text-gray-400 font-semibold uppercase">Asset Management System</p>
            </div>
        </div>
        <button onclick="location.reload()" class="text-xs font-bold border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-50">Reset Form</button>
    </header>

    <main class="p-8">
        
        <section id="step-macro" class="max-w-4xl mx-auto">
            <h2 class="text-center text-sm font-800 uppercase tracking-widest text-gray-400 mb-10">Select Department</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-8" id="macro-grid">
                </div>
        </section>

        <section id="step-sub" class="hidden max-w-4xl mx-auto">
            <div class="flex items-center mb-8">
                <button onclick="goBack('macro')" class="text-xs font-bold text-gray-500 hover:text-black">← Back</button>
                <h2 id="macro-title" class="ml-4 text-sm font-800 uppercase tracking-widest text-gray-400"></h2>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-8" id="sub-grid">
                </div>
        </section>

        <section id="step-form" class="hidden">
            <div class="form-container">
                <div class="mb-10 pb-6 border-b border-gray-100 flex justify-between items-end">
                    <div>
                        <span id="form-path" class="text-[10px] font-800 text-blue-600 uppercase tracking-widest"></span>
                        <h3 class="text-2xl font-800 mt-1">New Product Intake</h3>
                    </div>
                </div>

                <div class="mb-10">
                    <label class="field-label">Product Media (Images/Video)</label>
                    <div class="grid grid-cols-4 gap-4" id="media-grid">
                        <div onclick="document.getElementById('file-trigger').click()" class="media-upload-box">
                            <span class="text-2xl">+</span>
                            <span class="text-[9px] font-bold">Add</span>
                        </div>
                    </div>
                    <input type="file" id="file-trigger" class="hidden" onchange="handleMedia(this)">
                </div>

                <div class="grid grid-cols-1 gap-1">
                    <label class="field-label">Product Title</label>
                    <input type="text" id="prod-name" placeholder="e.g. Prestige Pressure Cooker" class="input-pro">
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="field-label">Retail Price (₹)</label>
                            <input type="text" id="prod-price" placeholder="0.00" class="input-pro">
                        </div>
                        <div>
                            <label class="field-label">Discount (%)</label>
                            <input type="text" id="prod-discount" placeholder="0" class="input-pro">
                        </div>
                    </div>
                </div>

                <div class="mt-4 mb-10">
                    <div class="flex justify-between items-center mb-4">
                        <label class="field-label">Specifications & Attributes</label>
                        <button onclick="addSpec()" class="text-[10px] font-800 text-blue-600 uppercase">+ Add Attribute</button>
                    </div>
                    <div id="spec-list" class="space-y-3"></div>
                </div>

                <label class="field-label">Marketing Description</label>
                <textarea id="prod-desc" placeholder="Write high-quality description..." class="input-pro h-32 resize-none"></textarea>

                <button id="publish-btn" onclick="publish()" class="btn-primary">Deploy Product to Store</button>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        // We use the 'db' variable already declared inside your config.js
        
        const catalog = {
            'Electronics': {
                img: 'electronics.jpg', 
                subs: { 'Television': 'tv.jpg', 'Kitchen Appliances': 'kitchen.png', 'Laptops': 'laptop.jpg' }
            },
            'Men Fashion': {
                img: 'men_fashion.jpg',
                subs: { 'Shirts': 'shirts.jpg', 'Footwear': 'men_shoes.jpg', 'Watches': 'watches.jpg' }
            },
            'Women Fashion': {
                img: 'women_fashion.jpg',
                subs: { 'Dresses': 'dresses.jpg', 'Handbags': 'bags.jpg', 'Jewellery': 'jewel.jpg' }
            },
            'Kids Fashion': {
                img: 'kids_fashion.jpg',
                subs: { 'Boys Clothing': 'boys.jpg', 'Girls Clothing': 'girls.jpg', 'Toys': 'toys.jpg' }
            },
            'Furniture': {
                img: 'furniture.jpg',
                subs: { 'Sofas': 'sofa.jpg', 'Beds': 'bed.jpg', 'Office Furniture': 'office.jpg' }
            },
            'Cosmetics': {
                img: 'cosmetics.jpg',
                subs: { 'Skincare': 'skin.jpg', 'Makeup': 'makeup.jpg', 'Fragrance': 'perfume.jpg' }
            }
        };

        let selectedPath = "";
        let productMedia = "";

        function init() {
            const grid = document.getElementById('macro-grid');
            grid.innerHTML = '';
            for (let m in catalog) {
                grid.innerHTML += `
                    <div class="category-card" onclick="pickMacro('${m}')">
                        <div class="category-image" style="background-image:url('${catalog[m].img}')"></div>
                        <div class="category-label">${m}</div>
                    </div>`;
            }
        }

        function pickMacro(m) {
            document.getElementById('step-macro').classList.add('hidden');
            document.getElementById('step-sub').classList.remove('hidden');
            document.getElementById('macro-title').innerText = m;
            const grid = document.getElementById('sub-grid');
            grid.innerHTML = '';
            for (let s in catalog[m].subs) {
                grid.innerHTML += `
                    <div class="category-card" onclick="pickSub('${m}', '${s}')">
                        <div class="category-image" style="background-image:url('${catalog[m].subs[s]}')"></div>
                        <div class="category-label">${s}</div>
                    </div>`;
            }
        }

        function pickSub(m, s) {
            selectedPath = s; 
            document.getElementById('step-sub').classList.add('hidden');
            document.getElementById('step-form').classList.remove('hidden');
            document.getElementById('form-path').innerText = `${m} / ${s}`;
            addSpec();
        }

        function addSpec() {
            const row = document.createElement('div');
            row.className = 'flex gap-3 spec-item';
            row.innerHTML = `
                <input type="text" placeholder="Attribute" class="attr-key input-pro !mb-0 w-1/3">
                <input type="text" placeholder="Value" class="attr-val input-pro !mb-0 w-2/3">
                <button onclick="this.parentElement.remove()" class="text-gray-300 hover:text-red-500 font-bold px-2">×</button>
            `;
            document.getElementById('spec-list').appendChild(row);
        }

        function handleMedia(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    productMedia = e.target.result;
                    const box = document.createElement('div');
                    box.className = 'relative aspect-square border rounded-lg overflow-hidden';
                    box.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                    document.getElementById('media-grid').insertBefore(box, document.getElementById('media-grid').firstChild);
                };
                reader.readAsDataURL(file);
            }
        }

        function goBack(step) {
            document.getElementById('step-macro').classList.add('hidden');
            document.getElementById('step-sub').classList.add('hidden');
            document.getElementById('step-form').classList.add('hidden');
            document.getElementById('step-' + step).classList.remove('hidden');
        }

        async function publish() {
            const btn = document.getElementById('publish-btn');
            btn.innerText = "SENDING TO CLOUD...";
            btn.disabled = true;

            try {
                const basePrice = parseFloat(document.getElementById('prod-price').value);
                const discPercent = parseFloat(document.getElementById('prod-discount').value || 0);
                const finalPrice = Math.round(basePrice - (basePrice * (discPercent / 100)));

                const specs = {};
                document.querySelectorAll('.spec-item').forEach(item => {
                    const key = item.querySelector('.attr-key').value;
                    const val = item.querySelector('.attr-val').value;
                    if(key) specs[key] = val;
                });

                // Sending to Firestore (NOT database())
                await db.collection("products").add({
                    name: document.getElementById('prod-name').value,
                    price: finalPrice,
                    oldPrice: discPercent > 0 ? basePrice : null,
                    imageURL: productMedia || "placeholder.jpg",
                    categoryPath: selectedPath,
                    description: document.getElementById('prod-desc').value,
                    wishlistCount: 0,
                    serialNumber: Date.now(),
                    specs: specs
                });

                alert('PRODUCT SUCCESSFULLY SYNCED TO STOREFRONT');
                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                alert("Upload failed. Check console.");
                btn.disabled = false;
                btn.innerText = "Deploy Product to Store";
            }
        }

        window.onload = init;
    </script>

</body>
</html>
