<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Hub | Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; min-height: 100vh; }
        .timer-bar {
            background: #111; border-bottom: 1px solid #22c55e33;
            padding: 10px; text-align: center; font-size: 10px;
            font-weight: 900; letter-spacing: 2px; color: #22c55e; text-transform: uppercase;
        }
        .profile-frame { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #22c55e; padding: 4px; position: relative; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; cursor: pointer; }
        .panel { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 18px; transition: 0.2s; }
        .editable-title { background: transparent; border: none; color: #fff; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; text-align: center; outline: none; width: 100%; }
        #loader-overlay { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #0a0a0a; border: 1px solid #222; width: 100%; max-width: 400px; border-radius: 24px; padding: 24px; }
        input, select, textarea { background: #111; border: 1px solid #222; color: white; padding: 12px; border-radius: 12px; width: 100%; font-size: 13px; outline: none; }
        .edit-badge { position: absolute; bottom: 5px; right: 5px; background: #22c55e; color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="w-10 h-10 border-2 border-green-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-[10px] font-bold tracking-[3px] text-green-500 uppercase">Syncing Database...</p>
    </div>

    <div class="timer-bar">
        Store Closing in: <span id="countdown">SYNCING...</span>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/60 backdrop-blur-md z-50">
        <a href="account.html" class="text-gray-400">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="flex gap-6">
            <a href="charts.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Analytics</a>
            <a href="asset_intake.html" class="text-[10px] font-bold uppercase tracking-widest text-green-500">Add Item</a>
        </div>
    </nav>

    <main class="flex flex-col items-center pt-4 pb-8">
        <div class="profile-frame">
            <img src="https://via.placeholder.com/120" class="profile-pic" id="pfp-display" onclick="document.getElementById('pfp-upload').click()">
            <label for="pfp-upload" class="edit-badge">✎</label>
            <input type="file" id="pfp-upload" class="hidden" accept="image/*" onchange="uploadProfilePic(this)">
        </div>

        <div class="mt-4 text-center">
            <span id="uid-text" class="text-[10px] font-mono text-gray-600 tracking-tighter uppercase">Loading ID...</span>
            <p id="item-count" class="text-[9px] font-black text-green-500 mt-1 uppercase tracking-widest">0 Items in Stock</p>
        </div>

        <div class="flex items-center justify-center gap-3 mt-4 px-4 w-full max-w-xs">
            <input type="text" class="editable-title" value="MY STORE" id="storeName" onblur="updateStoreName(this.value)">
        </div>

        <section class="w-full p-6 mt-6 space-y-4">
            <p class="text-[10px] font-black text-gray-700 uppercase tracking-[3px] mb-4">Inventory Feed</p>
            <div id="inventory-list" class="space-y-4">
                <p class="text-center text-gray-800 text-xs py-10">Fetching items...</p>
            </div>
        </section>
    </main>

    <div id="editModal" class="modal">
        <div class="modal-content space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-black uppercase tracking-widest text-green-500">Edit Product</h2>
                <button onclick="closeModal()" class="text-gray-500">&times;</button>
            </div>
            
            <input type="hidden" id="edit-id">
            
            <div>
                <label class="text-[9px] text-gray-500 uppercase font-bold ml-1">Product Name</label>
                <input type="text" id="edit-name">
            </div>
            
            <div>
                <label class="text-[9px] text-gray-500 uppercase font-bold ml-1">Price (₹)</label>
                <input type="number" id="edit-price">
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="stock-btn" onclick="toggleStock()" class="text-[9px] font-black p-3 rounded-xl uppercase bg-zinc-900 border border-zinc-800">Toggle Stock</button>
                <button onclick="goToFullEdit()" class="text-[9px] font-black p-3 rounded-xl uppercase bg-blue-600 text-white">Full Edit</button>
            </div>

            <button onclick="saveProduct()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl text-xs uppercase tracking-widest">Save Quick Changes</button>
            
            <button onclick="deleteProduct()" class="w-full bg-transparent border border-red-900/50 text-red-500 font-bold py-3 rounded-xl text-[10px] uppercase">Delete Permanently</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        let countdownInterval;
        let currentEditingStatus = true;

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                initStore(user);
            } else {
                window.location.href = "signin.html";
            }
        });

        async function initStore(user) {
            try {
                document.getElementById('uid-text').innerText = `ID: ZB-${user.uid.substring(0,8).toUpperCase()}`;
                
                const userDoc = await db.collection("user_data").doc(user.uid).get();
                if(userDoc.exists) {
                    const data = userDoc.data();
                    document.getElementById('storeName').value = data.storeName || "MY STORE";
                    document.getElementById('storeName').readOnly = false; // Allow editing
                    if(data.profilePic) document.getElementById('pfp-display').src = data.profilePic;
                    if(data.planExpiry) initTimer(data.planExpiry);
                }

                await loadInventory(user.uid);
                document.getElementById('loader-overlay').style.display = 'none';
            } catch (error) { console.error(error); }
        }

        async function uploadProfilePic(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64Img = e.target.result;
                document.getElementById('pfp-display').src = base64Img;
                const user = firebase.auth().currentUser;
                await db.collection("user_data").doc(user.uid).set({ profilePic: base64Img }, { merge: true });
            };
            reader.readAsDataURL(file);
        }

        async function updateStoreName(val) {
            const user = firebase.auth().currentUser;
            if(user) await db.collection("user_data").doc(user.uid).set({ storeName: val }, { merge: true });
        }

        async function loadInventory(uid) {
            const listContainer = document.getElementById('inventory-list');
            try {
                const snapshot = await db.collection("products").where("sellerId", "==", uid).get();
                document.getElementById('item-count').innerText = `${snapshot.size} Items in Stock`;

                if (snapshot.empty) {
                    listContainer.innerHTML = '<p class="text-center text-gray-500 text-xs py-10 uppercase tracking-widest">Inventory Empty</p>';
                    return;
                }

                listContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const isOut = item.status === "out_of_stock";
                    
                    listContainer.innerHTML += `
                        <div class="panel p-5 flex items-center justify-between ${isOut ? 'opacity-50' : ''}">
                            <div class="flex items-center gap-4">
                                <div class="relative">
                                    <img src="${item.imageURL || 'https://via.placeholder.com/50'}" class="w-12 h-12 bg-zinc-900 rounded-xl object-cover">
                                    ${isOut ? '<span class="absolute inset-0 flex items-center justify-center bg-red-600/80 text-[6px] font-black rounded-xl">OUT</span>' : ''}
                                </div>
                                <div>
                                    <h3 class="text-xs font-bold uppercase">${item.name || 'Product'}</h3>
                                    <p class="text-[9px] text-green-500 font-bold">₹${item.price || '0'}</p>
                                </div>
                            </div>
                            <button onclick="openEditModal('${doc.id}', '${item.name}', '${item.price}', '${item.status}')" class="text-[8px] font-black bg-zinc-800 text-white px-4 py-2 rounded-lg uppercase">Edit</button>
                        </div>`;
                });
            } catch (err) { console.error(err); }
        }

        function openEditModal(id, name, price, status) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-price').value = price;
            currentEditingStatus = status !== "out_of_stock";
            
            const btn = document.getElementById('stock-btn');
            btn.innerText = currentEditingStatus ? "MARK OUT OF STOCK" : "MARK AVAILABLE";
            btn.style.color = currentEditingStatus ? "#ef4444" : "#22c55e";
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function goToFullEdit() {
            const id = document.getElementById('edit-id').value;
            window.location.href = `asset_intake.html?edit=${id}`;
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function toggleStock() {
            const id = document.getElementById('edit-id').value;
            const newStatus = currentEditingStatus ? "out_of_stock" : "available";
            await db.collection("products").doc(id).update({ status: newStatus });
            location.reload();
        }

        async function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value;
            const price = parseFloat(document.getElementById('edit-price').value);
            await db.collection("products").doc(id).update({ name, price });
            location.reload();
        }

        async function deleteProduct() {
            if(confirm("Are you sure? This cannot be undone.")) {
                const id = document.getElementById('edit-id').value;
                await db.collection("products").doc(id).delete();
                location.reload();
            }
        }

        function initTimer(expiryDateStr) {
            const expiry = new Date(expiryDateStr).getTime();
            if (isNaN(expiry)) return;
            countdownInterval = setInterval(() => {
                const distance = expiry - Date.now();
                if (distance <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').innerText = "STORE CLOSED";
                    return;
                }
                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerText = `${d}D ${h}H ${m}M ${s}S`;
            }, 1000);
        }
    </script>
</body>
</html>
