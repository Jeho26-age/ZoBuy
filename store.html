<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Hub | Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; min-height: 100vh; }
        
        /* THE LOCK OVERLAY */
        #store-lock { 
            position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.3); 
            z-index: 999; 
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            pointer-events: all;
            transition: opacity 0.3s ease;
        }

        .lock-card {
            background: #000;
            border: 1px solid #22c55e;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 260px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 1);
        }

        /* Profile & Header */
        .profile-frame {
            width: 110px; height: 110px;
            border-radius: 50%; border: 3px solid #22c55e;
            padding: 4px; position: relative;
        }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; }
        
        .store-id-box { 
            display: flex; align-items: center; gap: 8px;
            background: #0a0a0a; padding: 6px 14px; border-radius: 10px;
            border: 1px solid #1a1a1a; margin-top: 15px;
        }
        .store-id { font-family: monospace; color: #555; font-size: 11px; font-weight: 800; }
        
        .editable-title { background: transparent; border: none; color: #fff; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; text-align: center; outline: none; width: 100%; }
        .panel { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 18px; transition: 0.2s; cursor: pointer; }
        .panel:active { transform: scale(0.98); background: #111; }

        /* Item Modal */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: block; }
    </style>
</head>
<body class="overflow-hidden"> <div id="store-lock">
        <div class="lock-card">
            <div class="w-10 h-10 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/20">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2 class="text-lg font-900 uppercase tracking-tighter mb-1 text-white">Activate Store</h2>
            <p class="text-gray-500 text-[8px] uppercase font-black tracking-widest mb-5">Subscription Required</p>
            <a href="gateway.html" class="block w-full bg-green-600 text-black font-900 py-3 rounded-xl uppercase text-[10px] tracking-widest">Purchase Access</a>
        </div>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/60 backdrop-blur-md z-50">
        <a href="account.html" class="text-gray-400">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="flex gap-6">
            <a href="charts.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Analytics</a>
            <a href="item.html" class="text-[10px] font-bold uppercase tracking-widest text-green-500">Add Item</a>
        </div>
    </nav>

    <main id="main-content" class="flex flex-col items-center pt-4 pb-8 transition-opacity duration-500">
        <div class="profile-frame">
            <img src="https://via.placeholder.com/120" class="profile-pic" id="pfp-display">
            <label for="pfp-input" class="absolute bottom-1 right-1 bg-green-600 p-2 rounded-full border-2 border-black cursor-pointer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"><path d="M12 5v14M5 12h14"></path></svg>
            </label>
            <input type="file" id="pfp-input" class="hidden" onchange="previewPfp(this)">
        </div>

        <div class="store-id-box">
            <span id="uid-text" class="store-id uppercase">ZB-9921-X10</span>
            <button onclick="copyUID()" class="text-green-500" id="copy-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>

        <div class="flex items-center justify-center gap-3 mt-6 px-4 w-full max-w-xs">
            <input type="text" class="editable-title" value="ALEXANDER'S STORE" id="storeName">
            <svg class="text-gray-700 flex-shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4L18.5 2.5z"></path></svg>
        </div>

        <section class="w-full p-6 mt-6 space-y-4">
            <p class="text-[10px] font-black text-gray-700 uppercase tracking-[3px] mb-4">Inventory Feed</p>
            
            <div onclick="openItem('Monolith Fridge X', '₹84,000', '12')" class="panel p-5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-zinc-900 rounded-xl border border-zinc-800"></div>
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-tight">Monolith Fridge X</h3>
                        <p class="text-[9px] text-zinc-600 font-bold uppercase">Stock: 12 Units</p>
                    </div>
                </div>
                <p class="text-green-500 font-900 text-sm">₹84,000</p>
            </div>
        </section>
    </main>

    <div id="item-modal" class="modal">
        <div class="flex justify-between items-center mb-10">
            <button onclick="closeItem()" class="text-white text-[10px] font-black uppercase tracking-widest bg-zinc-900 px-5 py-3 rounded-xl">← Back</button>
        </div>
        <h2 id="m-name" class="text-4xl font-900 uppercase tracking-tighter mb-4"></h2>
        <div class="grid grid-cols-2 gap-4 py-8 border-y border-zinc-900">
            <div>
                <p class="text-[10px] text-gray-600 font-black uppercase">Value</p>
                <p id="m-price" class="text-xl font-black text-green-500"></p>
            </div>
            <div>
                <p class="text-[10px] text-gray-600 font-black uppercase">Stock</p>
                <p id="m-stock" class="text-xl font-black text-white"></p>
            </div>
        </div>
    </div>

    <script>
        // Set this to TRUE to unlock instantly
        let hasPlan = true; 

        function updateUIStatus() {
            const lock = document.getElementById('store-lock');
            const body = document.body;
            const main = document.getElementById('main-content');

            if (hasPlan) {
                lock.style.display = 'none';
                body.classList.remove('overflow-hidden');
                body.classList.add('overflow-auto');
                main.style.opacity = "1";
            } else {
                lock.style.display = 'flex';
                body.classList.add('overflow-hidden');
                body.classList.remove('overflow-auto');
                main.style.opacity = "0.4"; // Dims background slightly when locked
            }
        }

        // Run immediately
        updateUIStatus();

        function copyUID() {
            const uid = "ZB-9921-X10";
            navigator.clipboard.writeText(uid).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="4"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                setTimeout(() => {
                    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                }, 1500);
            });
        }

        function previewPfp(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('pfp-display').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openItem(name, price, stock) {
            if (!hasPlan) return;
            document.getElementById('m-name').innerText = name;
            document.getElementById('m-price').innerText = price;
            document.getElementById('m-stock').innerText = stock;
            document.getElementById('item-modal').classList.add('active');
        }

        function closeItem() {
            document.getElementById('item-modal').classList.remove('active');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="config.js"></script>

<script>
  // Quick test to see if everything is working
  console.log("ZoBuy System: Page successfully connected to config.js");
</script>

</body>
</html>
