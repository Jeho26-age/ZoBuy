<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Hub | Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; min-height: 100vh; }
        
        .status-bar {
            background: #111; border-bottom: 1px solid #22c55e33;
            padding: 8px 15px; display: flex; justify-content: space-between;
            font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
        }

        .store-brand { font-size: 3.5rem; font-weight: 900; letter-spacing: -4px; line-height: 0.8; text-transform: uppercase; color: #fff; margin-bottom: 4px; }
        .plan-label { color: #22c55e; font-size: 11px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

        .panel { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; transition: 0.3s; }
        .panel:hover { border-color: #333; }
        
        .search-container { position: relative; width: 220px; margin: 25px auto; }
        .search-input { 
            width: 100%; background: #0a0a0a; border: 2px solid #222; border-radius: 14px; 
            padding: 12px 15px 12px 45px; font-size: 11px; font-weight: 800; color: white; 
            outline: none; text-transform: uppercase; transition: all 0.3s ease;
        }
        .search-input:focus { border-color: #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #22c55e; pointer-events: none; }

        #loader-overlay { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .countdown-text { font-family: monospace; font-weight: 900; letter-spacing: -1px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="w-8 h-8 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div class="status-bar">
        <span class="text-green-500">System Live</span>
        <span id="countdown" class="countdown-text text-white">00D 00H 00M 00S</span>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-xl z-50">
        <div class="flex gap-6 items-center">
            <a href="account.html" class="text-gray-500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
            <span class="text-[11px] font-900 uppercase tracking-widest text-white border-b-2 border-green-500 pb-1">Dashboard</span>
        </div>
        <div class="flex gap-3 items-center">
            <a href="sales.html" class="text-[10px] font-900 uppercase tracking-widest text-green-500 bg-green-500/10 px-3 py-1.5 rounded-full border border-green-500/20">Sales</a>
            <a href="promote.html" class="text-[10px] font-900 uppercase tracking-widest text-blue-500 bg-blue-500/10 px-3 py-1.5 rounded-full border border-blue-500/20">Promote</a>
            <a id="editStoreBtn" href="#" class="text-gray-400 hover:text-white transition-colors">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </a>
        </div>
    </nav>

    <header class="px-6 py-6 text-center">
        <h1 id="displayStoreName" class="store-brand">LOADING</h1>
        <p id="displayPlanName" class="plan-label">FETCHING SUBSCRIPTION...</p>
        
        <div class="mt-4">
            <a href="sales.html" class="text-[9px] font-900 text-zinc-500 border border-zinc-800 px-4 py-2 rounded-full uppercase tracking-widest hover:bg-zinc-900 transition-all">View Revenue History</a>
        </div>

        <div class="search-container">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="Search Products" class="search-input">
        </div>
    </header>

    <main class="p-6 space-y-12">
        <section id="pendingSection">
            <p class="text-[10px] font-900 text-zinc-600 uppercase tracking-[4px] mb-4">Live Orders</p>
            <div id="orders-list" class="space-y-4"></div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4">
                <p class="text-[10px] font-900 text-zinc-600 uppercase tracking-[4px]">Inventory</p>
                <a href="additem.html" class="text-green-500 font-900 text-[11px] uppercase border border-green-500/20 px-3 py-1 rounded-lg bg-green-500/5">Add New</a>
            </div>
            <div id="inventory-list" class="space-y-3"></div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        firebase.auth().onAuthStateChanged(user => {
            if (user) { 
                document.getElementById('editStoreBtn').href = `edit-store.html?uid=${user.uid}`;
                initDashboard(user); 
            } else { window.location.href = "signin.html"; }
        });

        async function initDashboard(user) {
            try {
                const userDoc = await db.collection("user_data").doc(user.uid).get();
                if(userDoc.exists) {
                    const data = userDoc.data();
                    document.getElementById('displayStoreName').innerText = data.storeName || "MY STORE";
                    
                    if (data.planName && data.planName.trim() !== "") {
                        document.getElementById('displayPlanName').innerText = data.planName + " PLAN";
                    } else if (data.hasPlan === true) {
                        document.getElementById('displayPlanName').innerText = "PREMIUM MERCHANT";
                    } else {
                        document.getElementById('displayPlanName').innerText = "NO ACTIVE PLAN";
                    }

                    if(data.planExpiry) startTimer(data.planExpiry);
                }
                await loadOrders(user.uid);
                await loadInventory(user.uid);
                document.getElementById('loader-overlay').style.display = 'none';
            } catch (e) { console.error(e); }
        }

        function startTimer(expiryDate) {
            const countEl = document.getElementById('countdown');
            function update() {
                const now = new Date().getTime();
                const distance = new Date(expiryDate).getTime() - now;
                if (distance < 0) { 
                    countEl.innerText = "EXPIRED"; 
                    countEl.classList.add("text-red-500");
                    return; 
                }
                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);
                countEl.innerText = `${String(d).padStart(2, '0')}D ${String(h).padStart(2, '0')}H ${String(m).padStart(2, '0')}M ${String(s).padStart(2, '0')}S`;
            }
            setInterval(update, 1000);
            update();
        }

        async function loadOrders(uid) {
            const list = document.getElementById('orders-list');
            const snap = await db.collection("orders").where("sellerId", "==", uid).where("status", "==", "pending").get();
            list.innerHTML = snap.empty ? '<p class="text-zinc-800 text-[10px] font-900 uppercase">No pending orders found</p>' : '';
            snap.forEach(doc => {
                const o = doc.data();
                list.innerHTML += `
                <div class="panel p-5 border-l-4 border-green-500 bg-zinc-950/50">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xs font-900 uppercase text-white">${o.productName}</h3>
                            <p class="text-[9px] text-zinc-500 mt-1 uppercase">Order ID: ${doc.id.slice(0,8)}</p>
                        </div>
                        <p class="text-green-400 font-900 text-sm tracking-tighter">₹${o.price}</p>
                    </div>
                    <button onclick="updateStatus('${doc.id}','completed')" class="w-full bg-white text-black text-[10px] font-900 py-3 rounded-xl uppercase active:scale-95 transition-transform">Mark Completed</button>
                </div>`;
            });
        }

                        async function loadInventory(uid) {
            const list = document.getElementById('inventory-list');
            let snap = await db.collection("products").where("userId", "==", uid).get();
            
            if (snap.empty) {
                snap = await db.collection("products").where("sellerId", "==", uid).get();
            }

            list.innerHTML = '';
            
            if (snap.empty) {
                list.innerHTML = '<p class="text-zinc-800 text-[10px] font-900 uppercase">No products in inventory</p>';
                return;
            }

            snap.forEach(doc => {
                const i = doc.data();
                list.innerHTML += `
                <div class="inventory-card panel p-4 flex items-center justify-between bg-zinc-950/30" data-name="${i.name}">
                    <div class="flex items-center gap-4">
                        <div class="relative w-12 h-12">
                             <img src="${i.imageURL || i.image}" class="w-full h-full rounded-xl object-cover bg-zinc-900 border border-zinc-800">
                        </div>
                        <div>
                            <h4 class="text-[11px] font-900 uppercase tracking-tight text-zinc-200">${i.name}</h4>
                            <p class="text-[9px] font-700 text-zinc-600 uppercase">Stock: ${i.stock || '0'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-end">
                            <p class="text-xs font-900 text-white">₹${i.price}</p>
                            <div class="flex gap-3 mt-2">
                                <a href="add.html?edit=${doc.id}" class="text-[9px] text-blue-500 font-900 uppercase">Edit</a>
                                <button onclick="deleteProduct('${doc.id}')" class="text-[9px] text-red-500 font-900 uppercase">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }


        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.inventory-card').forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                item.style.display = name.includes(query) ? "flex" : "none";
            });
        }

        async function deleteProduct(id) {
            if(confirm("Are you sure you want to delete this product?")) {
                await db.collection("products").doc(id).delete();
                location.reload();
            }
        }
        
        async function updateStatus(id, status) {
            try {
                await db.collection("orders").doc(id).update({ status: status });
                location.reload();
            } catch(e) { alert("Error updating status"); }
        }
    </script>
</body>
</html>
