<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Hub | Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; min-height: 100vh; }
        
        /* THE LOCK OVERLAY */
        #store-lock { 
            position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.3); 
            z-index: 999; 
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            pointer-events: all;
            transition: opacity 0.3s ease;
        }

        .lock-card {
            background: #000;
            border: 1px solid #22c55e;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 260px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 1);
        }

        /* Profile & Header */
        .profile-frame {
            width: 110px; height: 110px;
            border-radius: 50%; border: 3px solid #22c55e;
            padding: 4px; position: relative;
        }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; }
        
        .store-id-box { 
            display: flex; align-items: center; gap: 8px;
            background: #0a0a0a; padding: 6px 14px; border-radius: 10px;
            border: 1px solid #1a1a1a; margin-top: 15px;
        }
        .store-id { font-family: monospace; color: #555; font-size: 11px; font-weight: 800; }
        
        .editable-title { background: transparent; border: none; color: #fff; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; text-align: center; outline: none; width: 100%; }
        
        .panel { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 18px; transition: 0.2s; position: relative; }
        
        /* Countdown Timer Style */
        .timer-bar {
            background: #111;
            border-bottom: 1px solid #22c55e33;
            padding: 10px;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #22c55e;
            text-transform: uppercase;
        }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: block; }

        /* Success Modal Overlay */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .success-card {
            background: #111;
            border: 1px solid #22c55e33;
            padding: 40px 20px;
            border-radius: 24px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .input-edit {
            background: #111;
            border: 1px solid #222;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .btn-primary {
            background: #22c55e;
            color: #000;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
        }
    </style>
</head>
<body class="overflow-hidden">

    <div id="update-success-modal" class="success-overlay">
        <div class="success-card">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-500/40">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h2 class="text-xl font-900 uppercase tracking-tighter mb-2">Updated</h2>
            <p class="text-gray-500 text-[10px] uppercase font-bold tracking-widest mb-8">Successfully Updated to Store</p>
            <button onclick="reloadPage()" class="btn-primary">Continue</button>
        </div>
    </div>

    <div class="timer-bar">
        Store Closing in: <span id="countdown">28d 00h 00m 00s</span>
    </div>

    <div id="store-lock">
        <div class="lock-card">
            <div class="w-10 h-10 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/20">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2 class="text-lg font-900 uppercase tracking-tighter mb-1 text-white">Activate Store</h2>
            <p class="text-gray-500 text-[8px] uppercase font-black tracking-widest mb-5">Subscription Required</p>
            <a href="gateway.html" class="block w-full bg-green-600 text-black font-900 py-3 rounded-xl uppercase text-[10px] tracking-widest">Purchase Access</a>
        </div>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/60 backdrop-blur-md z-50">
        <a href="account.html" class="text-gray-400">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="flex gap-6">
            <a href="charts.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Analytics</a>
            <a href="item.html" class="text-[10px] font-bold uppercase tracking-widest text-green-500">Add Item</a>
        </div>
    </nav>

    <main id="main-content" class="flex flex-col items-center pt-4 pb-8 transition-opacity duration-500">
        <div class="profile-frame">
            <img src="https://via.placeholder.com/120" class="profile-pic" id="pfp-display">
            <label for="pfp-input" class="absolute bottom-1 right-1 bg-green-600 p-2 rounded-full border-2 border-black cursor-pointer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4"><path d="M12 5v14M5 12h14"></path></svg>
            </label>
            <input type="file" id="pfp-input" class="hidden" onchange="previewPfp(this)">
        </div>

        <div class="store-id-box">
            <span id="uid-text" class="store-id uppercase">ZB-9921-X10</span>
            <button onclick="copyUID()" class="text-green-500" id="copy-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>

        <div class="flex items-center justify-center gap-3 mt-6 px-4 w-full max-w-xs">
            <input type="text" class="editable-title" value="ALEXANDER'S STORE" id="storeName">
        </div>

        <section class="w-full p-6 mt-6 space-y-4">
            <p class="text-[10px] font-black text-gray-700 uppercase tracking-[3px] mb-4">Inventory Feed</p>
            <div id="inventory-list" class="space-y-4">
                <p class="text-center text-gray-600 text-xs py-10">Loading inventory...</p>
            </div>
        </section>
    </main>

    <div id="item-modal" class="modal">
        <div class="flex justify-between items-center mb-8">
            <button onclick="closeItem()" class="text-white text-[10px] font-black uppercase tracking-widest bg-zinc-900 px-5 py-3 rounded-xl">← Close</button>
            <button onclick="deleteProduct()" class="text-red-500 text-[10px] font-black uppercase tracking-widest bg-red-500/10 px-5 py-3 rounded-xl border border-red-500/20">Delete Item</button>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Product Name</label>
                <input type="text" id="edit-name" class="input-edit">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Current Price (₹)</label>
                    <input type="number" id="edit-price" class="input-edit">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Discount (₹)</label>
                    <input type="number" id="edit-discount" class="input-edit">
                </div>
            </div>

            <div>
                <label class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Description</label>
                <textarea id="edit-desc" class="input-edit h-32"></textarea>
            </div>

            <button id="save-btn" onclick="saveChanges()" class="w-full bg-green-600 text-black font-900 py-4 rounded-xl uppercase tracking-widest text-xs">Update Item Info</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        let hasPlan = true;
        let currentEditingId = null;

        function startCountdown() {
            const expiryDate = new Date().getTime() + (28 * 24 * 60 * 60 * 1000);
            setInterval(() => {
                const now = new Date().getTime();
                const diff = expiryDate - now;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML = `${d}d ${h}h ${m}m ${s}s`;
            }, 1000);
        }

        async function loadInventory() {
            const listContainer = document.getElementById('inventory-list');
            try {
                const snapshot = await db.collection("products").orderBy("serialNumber", "desc").get();
                listContainer.innerHTML = '';
                if (snapshot.empty) {
                    listContainer.innerHTML = '<p class="text-center text-gray-700 text-xs py-10">No items found.</p>';
                    return;
                }
                snapshot.forEach(doc => {
                    const item = doc.data();
                    const id = doc.id;
                    listContainer.innerHTML += `
                        <div class="panel p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <img src="${item.imageURL}" class="w-12 h-12 bg-zinc-900 rounded-xl border border-zinc-800 object-cover">
                                <div>
                                    <h3 class="text-xs font-bold uppercase tracking-tight">${item.name}</h3>
                                    <p class="text-[9px] text-green-500 font-bold uppercase">₹${item.price}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="promoteItem('${id}')" class="text-[8px] font-black bg-blue-600/10 text-blue-400 border border-blue-500/20 px-3 py-2 rounded-lg uppercase">Promote</button>
                                <button onclick="openEditModal('${id}', \`${item.name}\`, ${item.price}, ${item.oldPrice || 0}, \`${item.description}\`)" class="text-[8px] font-black bg-zinc-800 text-white px-3 py-2 rounded-lg uppercase">Edit</button>
                            </div>
                        </div>`;
                });
            } catch (err) { console.error(err); }
        }

        function openEditModal(id, name, price, oldPrice, desc) {
            currentEditingId = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-discount').value = oldPrice > 0 ? (oldPrice - price) : 0;
            document.getElementById('edit-desc').value = desc;
            document.getElementById('item-modal').classList.add('active');
        }

        async function saveChanges() {
            if(!currentEditingId) return;
            const btn = document.getElementById('save-btn');
            btn.innerText = "UPDATING...";
            btn.disabled = true;

            const newPrice = parseFloat(document.getElementById('edit-price').value);
            const disc = parseFloat(document.getElementById('edit-discount').value);

            try {
                await db.collection("products").doc(currentEditingId).update({
                    name: document.getElementById('edit-name').value,
                    price: newPrice,
                    oldPrice: disc > 0 ? (newPrice + disc) : null,
                    description: document.getElementById('edit-desc').value
                });
                
                // SHOW CUSTOM SUCCESS MODAL INSTEAD OF ALERT
                document.getElementById('update-success-modal').style.display = 'flex';
            } catch (err) {
                alert("Update failed");
                btn.disabled = false;
                btn.innerText = "Update Item Info";
            }
        }

        function reloadPage() {
            location.reload();
        }

        async function deleteProduct() {
            if(confirm("Are you sure?")) {
                await db.collection("products").doc(currentEditingId).delete();
                location.reload();
            }
        }

        async function promoteItem(id) {
            await db.collection("promotions").add({
                productId: id,
                requestDate: new Date().toISOString(),
                status: "pending"
            });
            alert("Sent to Admin!");
        }

        function closeItem() { document.getElementById('item-modal').classList.remove('active'); }

        window.onload = () => {
            startCountdown();
            loadInventory();
            if (hasPlan) {
                document.getElementById('store-lock').style.display = 'none';
                document.body.classList.remove('overflow-hidden');
            }
        };
    </script>
</body>
</html>
