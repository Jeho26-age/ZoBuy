<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Hub | Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0; min-height: 100vh; }
        .timer-bar {
            background: #111; border-bottom: 1px solid #22c55e33;
            padding: 10px; text-align: center; font-size: 10px;
            font-weight: 900; letter-spacing: 2px; color: #22c55e; text-transform: uppercase;
        }
        .profile-frame { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #22c55e; padding: 4px; position: relative; }
        .profile-pic { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; }
        .panel { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 18px; transition: 0.2s; }
        .editable-title { background: transparent; border: none; color: #fff; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; text-align: center; outline: none; width: 100%; }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: block; }
    </style>
</head>
<body>

    <div class="timer-bar">
        Store Closing in: <span id="countdown">SYNCING...</span>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-black/60 backdrop-blur-md z-50">
        <a href="account.html" class="text-gray-400">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="flex gap-6">
            <a href="charts.html" class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Analytics</a>
            <a href="item.html" class="text-[10px] font-bold uppercase tracking-widest text-green-500">Add Item</a>
        </div>
    </nav>

    <main id="main-content" class="flex flex-col items-center pt-4 pb-8">
        <div class="profile-frame">
            <img src="https://via.placeholder.com/120" class="profile-pic" id="pfp-display">
        </div>

        <div class="mt-4 text-center">
            <span id="uid-text" class="text-[10px] font-mono text-gray-600 tracking-tighter">ID: LOADING</span>
        </div>

        <div class="flex items-center justify-center gap-3 mt-4 px-4 w-full max-w-xs">
            <input type="text" class="editable-title" value="LOADING..." id="storeName">
        </div>

        <section class="w-full p-6 mt-6 space-y-4">
            <p class="text-[10px] font-black text-gray-700 uppercase tracking-[3px] mb-4">Inventory Feed</p>
            <div id="inventory-list" class="space-y-4">
                <p class="text-center text-gray-800 text-xs py-10">Loading inventory...</p>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="auth-check.js"></script>

    <script>
        let countdownInterval;

        window.onload = () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    // Running both at once for speed
                    fetchData(user);
                    loadInventory();
                }
            });
        };

        async function fetchData(user) {
            document.getElementById('uid-text').innerText = `ID: ZB-${user.uid.substring(0,8).toUpperCase()}`;
            const userDoc = await db.collection("user_data").doc(user.uid).get();
            
            if(userDoc.exists) {
                const data = userDoc.data();
                document.getElementById('storeName').value = data.storeName || "MY STORE";
                if(data.profilePic) document.getElementById('pfp-display').src = data.profilePic;
                
                // Start the Realtime Countdown
                if(data.planExpiry) {
                    initTimer(data.planExpiry);
                } else {
                    document.getElementById('countdown').innerText = "NO ACTIVE PLAN";
                }
            }
        }

        function initTimer(expiryDateStr) {
            const expiry = new Date(expiryDateStr).getTime();
            
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = Date.now();
                const distance = expiry - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').innerText = "STORE CLOSED";
                    // Trigger redirect via auth-check logic
                    window.location.reload(); 
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('countdown').innerText = 
                    `${days}D ${hours}H ${minutes}M ${seconds}S`;
            }, 1000);
        }

        async function loadInventory() {
            const listContainer = document.getElementById('inventory-list');
            try {
                // Limit to 10 items for faster initial load
                const snapshot = await db.collection("products").orderBy("serialNumber", "desc").limit(10).get();
                listContainer.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const item = doc.data();
                    listContainer.innerHTML += `
                        <div class="panel p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <img src="${item.imageURL}" class="w-12 h-12 bg-zinc-900 rounded-xl object-cover">
                                <div>
                                    <h3 class="text-xs font-bold uppercase">${item.name}</h3>
                                    <p class="text-[9px] text-green-500 font-bold">₹${item.price}</p>
                                </div>
                            </div>
                            <button class="text-[8px] font-black bg-zinc-800 text-white px-3 py-2 rounded-lg uppercase">Edit</button>
                        </div>`;
                });
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
