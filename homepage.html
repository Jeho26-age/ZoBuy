<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobuy - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- KEEPING YOUR EXACT DESIGN --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #fcfcfc; padding-bottom: 100px; }

        header { 
            padding: 10px 15px; display: flex; align-items: center; gap: 15px; 
            background: white; position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid #eee; height: 70px; 
        }

        .logo-small { width: 75px; height: auto; max-height: 55px; object-fit: contain; }
        .search-container { flex: 1; position: relative; display: flex; align-items: center; }
        .search-container input { 
            width: 100%; padding: 12px 15px 12px 45px; border-radius: 25px; 
            border: 1px solid #e0e0e0; background: #f5f5f5; font-size: 14px; 
        }
        .search-container i { position: absolute; left: 18px; color: #888; }

        /* Banner Styles */
        .banner-wrapper { width: 100%; overflow: hidden; padding: 15px 0; }
        .banner-container { display: flex; overflow-x: auto; scroll-behavior: smooth; scroll-snap-type: x mandatory; gap: 12px; padding: 0 15px; }
        .banner-container::-webkit-scrollbar { display: none; }
        .banner { min-width: 100%; height: 180px; border-radius: 20px; scroll-snap-align: center; position: relative; overflow: hidden; display: flex; background: #333; }
        .banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .banner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(0,0,0,0.7), transparent); z-index: 2; padding: 25px; display: flex; flex-direction: column; justify-content: center; color: white; }
        .promo-badge { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.3); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 700; z-index: 3; }

        /* Grid Styles */
        .section-title { padding: 25px 15px 12px 15px; font-size: 19px; font-weight: 700; color: #1a1a1a; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }
        
        .product-card { background: white; border-radius: 15px; border: 1px solid #f0f0f0; overflow: hidden; position: relative; }
        .product-image { background: #f9f9f9; height: 160px; display: flex; align-items: center; justify-content: center; position: relative; }
        .product-image img { max-width: 75%; max-height: 75%; object-fit: contain; }
        
        .wishlist-btn {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: white; width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #ccc; transition: 0.3s;
        }
        .wishlist-btn.active { color: #ff5252; }

        .discount-tag { position: absolute; top: 10px; left: 10px; background: #ff5252; color: white; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; z-index: 5; }
        .product-info { padding: 12px; }
        .product-brand { font-weight: 700; font-size: 14px; color: #333; }
        .product-name { color: #777; font-size: 12px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-container { display: flex; align-items: center; gap: 6px; }
/* Keep current price Black as requested */
.new-price { 
    color: #ff5252;              /* Change this to Black */
    font-weight: 700; 
    font-size: 15px; 
}

/* Make only the discount price and the cut-line Red */
.old-price { 
    color: #000;             /* Change this to Red */
    text-decoration: line-through; 
    text-decoration-color: #ff5252; /* Ensures the 'cut line' is Red */
    font-size: 12px; 
}

.discount-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ff5252;
    color: white;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 10px 5px 15px;
    /* This creates the tag shape */
    clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 15% 50%, 0% 0%);
    z-index: 10;
    display: flex;
    align-items: center;
}

/* This creates the 'hole' in the tag */
.discount-tag::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
}


        /* Nav Styles */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 2000; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: #ffca28; }

        /* Helper to hide empty sections */
        .hidden-section { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Zobuy" class="logo-small">
        <div class="search-container">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search Zobuy">
        </div>
    </header>

    <div class="banner-wrapper" id="banner-section">
        <div class="banner-container" id="promoBanner">
            </div>
    </div>

    <div id="main-content">
        <div id="foryou-container" class="hidden-section">
            <div class="section-title">For You</div>
            <div class="product-grid" id="foryou-grid"></div>
        </div>

        <div id="new-container" class="hidden-section">
            <div class="section-title">New Arrival</div>
            <div class="product-grid" id="new-grid"></div>
        </div>

        <div id="discount-container" class="hidden-section">
            <div class="section-title">Best Discount</div>
            <div class="product-grid" id="discount-grid"></div>
        </div>

        <div id="trending-container" class="hidden-section">
            <div class="section-title">Trending This Week</div>
            <div class="product-grid" id="trending-grid"></div>
        </div>

        <div id="best-container" class="hidden-section">
            <div class="section-title">Best Sell</div>
            <div class="product-grid" id="best-grid"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="homepage.html" class="nav-item active"><i class="fa fa-home"></i>Home</a>
        <a href="categories.html" class="nav-item"><i class="fa fa-th-large"></i>Categories</a>
        <a href="account.html" class="nav-item"><i class="fa fa-user-circle"></i>Account</a>
        <a href="cart.html" class="nav-item"><i class="fa fa-shopping-cart"></i>Cart</a>
    </nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="config.js"></script>
<script src="sorter.js"></script>


</body>
</html>
