<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobuy - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- CORE DESIGN --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #fcfcfc; padding-bottom: 100px; }

        header { 
            padding: 10px 15px; display: flex; align-items: center; gap: 15px; 
            background: white; position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid #eee; height: 70px; 
        }

        .logo-small { width: 75px; height: auto; max-height: 55px; object-fit: contain; }
        .search-container { flex: 1; position: relative; display: flex; align-items: center; }
        .search-container input { 
            width: 100%; padding: 12px 15px 12px 45px; border-radius: 25px; 
            border: 1px solid #e0e0e0; background: #f5f5f5; font-size: 14px; 
        }
        .search-container i { position: absolute; left: 18px; color: #888; }

        /* Banner Styles */
        .banner-wrapper { width: 100%; overflow: hidden; padding: 15px 0; }
        .banner-container { display: flex; overflow-x: auto; scroll-behavior: smooth; scroll-snap-type: x mandatory; gap: 12px; padding: 0 15px; }
        .banner-container::-webkit-scrollbar { display: none; }
        .banner { min-width: 100%; height: 180px; border-radius: 20px; scroll-snap-align: center; position: relative; overflow: hidden; display: flex; background: #333; }
        .banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .banner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to right, rgba(0,0,0,0.7), transparent); z-index: 2; padding: 25px; display: flex; flex-direction: column; justify-content: center; color: white; }

        /* Grid Styles */
        .section-title { padding: 25px 15px 12px 15px; font-size: 19px; font-weight: 700; color: #1a1a1a; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }
        
        .product-card { background: white; border-radius: 15px; border: 1px solid #f0f0f0; overflow: hidden; position: relative; cursor: pointer; }
        .product-image { background: #f9f9f9; height: 160px; display: flex; align-items: center; justify-content: center; position: relative; }
        .product-image img { max-width: 75%; max-height: 75%; object-fit: contain; }
        
        .product-info { padding: 12px; position: relative; }

        .product-name { 
            color: #000; font-size: 15px; font-weight: 700; margin-bottom: 8px; 
            white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2;
        }

        .price-container { display: flex; align-items: center; gap: 6px; }
        .new-price { color: #000; font-weight: 700; font-size: 15px; }
        .old-price { color: #ff5252; text-decoration: line-through; font-size: 12px; }

        .discount-tag {
            position: absolute; top: 10px; left: 10px; background: #ff5252; color: white;
            font-size: 11px; font-weight: 800; padding: 5px 10px 5px 15px;
            clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 15% 50%, 0% 0%); z-index: 10;
        }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 2000; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 11px; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: #ffca28; }

        .hidden-section { display: none; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Zobuy" class="logo-small">
        <div class="search-container">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search Zobuy">
        </div>
    </header>

    <div class="banner-wrapper" id="banner-section">
        <div class="banner-container" id="promoBanner"></div>
    </div>

    <div id="main-content">
        <div id="foryou-container" class="hidden-section">
            <div class="section-title">For You</div>
            <div class="product-grid" id="foryou-grid"></div>
        </div>

        <div id="new-container" class="hidden-section">
            <div class="section-title">New Arrival</div>
            <div class="product-grid" id="new-grid"></div>
        </div>

        <div id="discount-container" class="hidden-section">
            <div class="section-title">Best Discount</div>
            <div class="product-grid" id="discount-grid"></div>
        </div>

        <div id="trending-container" class="hidden-section">
            <div class="section-title">Trending This Week</div>
            <div class="product-grid" id="trending-grid"></div>
        </div>

        <div id="best-container" class="hidden-section">
            <div class="section-title">Best Sell</div>
            <div class="product-grid" id="best-grid"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="homepage.html" class="nav-item active"><i class="fa fa-home"></i>Home</a>
        <a href="categories.html" class="nav-item"><i class="fa fa-th-large"></i>Categories</a>
        <a href="account.html" class="nav-item"><i class="fa fa-user-circle"></i>Account</a>
        <a href="cart.html" class="nav-item"><i class="fa fa-shopping-cart"></i>Cart</a>
    </nav>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>

<script>
    // Removed 'const db' to prevent "already declared" error from config.js
    
    async function init() {
        const params = new URLSearchParams(window.location.search);
        const filterValue = params.get('filter');

        if (filterValue) {
            document.getElementById('banner-section').style.display = 'none';
            await renderFilteredResults(filterValue);
        } else {
            loadBanners();
            loadSections();
        }
    }

    async function renderFilteredResults(filterValue) {
        const mainContent = document.getElementById('main-content');
        mainContent.innerHTML = `
            <div class="section-title">Results for: ${filterValue}</div>
            <div class="product-grid" id="filter-grid"></div>
        `;
        const grid = document.getElementById('filter-grid');

        // Note: Using 'db' which is already initialized in your config.js
        const snapshot = await db.collection("products")
            .where("subcategory", "==", filterValue)
            .get();

        if (snapshot.empty) {
            grid.innerHTML = `<p style="padding:20px; color:#888;">No items found.</p>`;
            return;
        }

        snapshot.forEach(doc => {
            grid.innerHTML += generateCardHTML(doc.id, doc.data());
        });
    }

    async function loadSections() {
        const sections = [
            { q: db.collection("products").where("tags", "array-contains", "foryou"), g: "foryou-grid", c: "foryou-container" },
            { q: db.collection("products").orderBy("createdAt", "desc").limit(8), g: "new-grid", c: "new-container" },
            { q: db.collection("products").where("tags", "array-contains", "discount"), g: "discount-grid", c: "discount-container" },
            { q: db.collection("products").where("tags", "array-contains", "trending"), g: "trending-grid", c: "trending-container" },
            { q: db.collection("products").where("tags", "array-contains", "best"), g: "best-grid", c: "best-container" }
        ];

        for (const sec of sections) {
            const snap = await sec.q.get();
            if (!snap.empty) {
                document.getElementById(sec.c).classList.remove('hidden-section');
                const grid = document.getElementById(sec.g);
                snap.forEach(doc => {
                    grid.innerHTML += generateCardHTML(doc.id, doc.data());
                });
            }
        }
    }

    function generateCardHTML(id, data) {
        const discount = data.oldPrice ? Math.round(((data.oldPrice - data.price) / data.oldPrice) * 100) : 0;
        return `
            <div class="product-card" onclick="window.location.href='item-view.html?id=${id}'">
                ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                <div class="product-image">
                    <img src="${data.imageURL || data.image}" alt="${data.name}">
                </div>
                <div class="product-info">
                    <div class="product-name">${data.name}</div>
                    <div class="price-container">
                        <span class="new-price">₹${data.price}</span>
                        ${data.oldPrice ? `<span class="old-price">₹${data.oldPrice}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    async function loadBanners() {
        const bannerContainer = document.getElementById('promoBanner');
        const snap = await db.collection("banners").get();
        snap.forEach(doc => {
            const b = doc.data();
            bannerContainer.innerHTML += `
                <div class="banner">
                    <img src="${b.image}" alt="Promo">
                    <div class="banner-overlay"><h2>${b.title || ''}</h2></div>
                </div>
            `;
        });
    }

    init();
</script>
</body>
</html>
