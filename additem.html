<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobuy Admin - Pick Category</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --zobuy-green: #1a4d2e; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #fff; color: #333; }
        
        .header { padding: 25px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .header h2 { margin: 0; font-size: 1.3rem; font-weight: 800; color: var(--zobuy-green); }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #eee;
        }
        
        .icon-circle img { width: 100%; height: 100%; object-fit: cover; }
        .cat-name { font-size: 11px; font-weight: 600; text-transform: capitalize; }

        .back-btn {
            display: none;
            margin: 15px 20px 0;
            padding: 10px 20px;
            background: var(--zobuy-green);
            border-radius: 30px;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .error-msg {
            grid-column: span 4;
            color: red;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="header">
    <h2 id="pickerTitle">Product Category</h2>
</div>

<button class="back-btn" id="backBtn" onclick="showMainCategories()">
    <i class="fa fa-arrow-left"></i> Back
</button>

<div class="category-grid" id="categoryGrid">
    <p class="error-msg">Loading categories...</p>
</div>

<script src="categories-data.js"></script>

<script>
    const grid = document.getElementById('categoryGrid');
    const title = document.getElementById('pickerTitle');
    const backBtn = document.getElementById('backBtn');

    function showMainCategories() {
        // SAFETY CHECK: If categoryData doesn't exist, show an error
        if (typeof categoryData === 'undefined') {
            grid.innerHTML = `<div class="error-msg">
                <b>Error:</b> Data not found!<br>
                Make sure your file is named <b>categories-data.js</b> <br>
                and is in the same folder as this file.
            </div>`;
            return;
        }

        backBtn.style.display = 'none';
        title.innerText = "Product Category";
        grid.innerHTML = '';

        categoryData.forEach((cat, index) => {
            const item = document.createElement('div');
            item.className = 'cat-item';
            item.onclick = () => showSubCategories(index);
            
            item.innerHTML = `
                <div class="icon-circle">
                    <img src="${cat.sidebarImg}" onerror="this.src='https://via.placeholder.com/70?text=Error'">
                </div>
                <div class="cat-name">${cat.name}</div>
            `;
            grid.appendChild(item);
        });
    }

    function showSubCategories(mainIndex) {
        const selectedMain = categoryData[mainIndex];
        backBtn.style.display = 'block';
        title.innerText = selectedMain.name;
        grid.innerHTML = '';

        if (selectedMain.subs) {
            selectedMain.subs.forEach(sub => {
                const item = document.createElement('div');
                item.className = 'cat-item';
                item.onclick = () => {
                    // This creates a combined string like "Furniture - Sofa"
                    const fullCategoryPath = `${selectedMain.name} - ${sub.name}`;
                    // This takes you to add.html with the full info
                    window.location.href = `add.html?category=${encodeURIComponent(fullCategoryPath)}`;
                };
                
                item.innerHTML = `
                    <div class="icon-circle">
                        <img src="${sub.img}" onerror="this.src='https://via.placeholder.com/70?text=Error'">
                    </div>
                    <div class="cat-name">${sub.name}</div>
                `;
                grid.appendChild(item);
            });
        }
    }

    // Run on start
    window.onload = showMainCategories;
</script>

</body>
</html>
