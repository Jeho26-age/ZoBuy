<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Analytics | Professional Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #1a1a1a; }
        .admin-header {
            background: #fff; border-bottom: 1px solid #e5e7eb;
            padding: 15px 30px; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .stat-card {
            background: #fff; padding: 24px; border-radius: 12px;
            border: 1px solid #e5e7eb; transition: all 0.2s ease;
        }
        .filter-btn {
            padding: 6px 12px; font-size: 12px; font-weight: 600;
            border-radius: 6px; border: 1px solid #e5e7eb;
            background: #fff; cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active { background: #000; color: #fff; border-color: #000; }
        
        #chart-wrapper { position: relative; height: 350px; width: 100%; }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="flex items-center gap-4">
            <a href="store.html" class="text-2xl hover:opacity-50 text-black no-underline">←</a>
            <h1 class="text-lg font-800 tracking-tight">Seller Insights</h1>
        </div>
        <div class="flex gap-2">
            <button class="filter-btn active" onclick="updateTimeframe('24h', this)">24 Hours</button>
            <button class="filter-btn" onclick="updateTimeframe('7d', this)">7 Days</button>
            <button class="filter-btn" onclick="updateTimeframe('30d', this)">30 Days</button>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto space-y-6">

        <div class="stat-card">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-[11px] font-800 text-gray-400 uppercase tracking-widest">Total Sales</p>
                    <h2 id="display-revenue" class="text-3xl font-800 mt-1 text-black">₹8,236.52</h2>
                    <p class="text-xs text-green-500 font-700 mt-1">↗ 578% Growth</p>
                </div>
                <div class="text-right">
                    <p class="text-[11px] font-800 text-gray-400 uppercase tracking-widest">Active Visitors</p>
                    <div class="flex items-center gap-2 justify-end mt-1">
                         <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-600"></span>
                        </span>
                        <p class="text-lg font-800 text-blue-600">8 Live</p>
                    </div>
                </div>
            </div>
            <div id="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="stat-card">
                <p class="text-[10px] font-800 text-gray-400 uppercase">Lifetime Revenue</p>
                <p class="text-2xl font-800 mt-1 text-black">₹4,52,800</p>
            </div>
            <div class="stat-card">
                <p class="text-[10px] font-800 text-gray-400 uppercase">Total Items in Stock</p>
                <p class="text-2xl font-800 mt-1 text-black">3,850</p>
            </div>
            <div class="stat-card border-l-4 border-l-green-500">
                <p class="text-[10px] font-800 text-gray-400 uppercase">Most Sold Item</p>
                <p class="text-lg font-800 mt-1 text-black">Prestige Cooker</p>
                <p class="text-[10px] text-gray-400">214 Units Sold</p>
            </div>
            <div class="stat-card border-l-4 border-l-red-500">
                <p class="text-[10px] font-800 text-gray-400 uppercase">Least Sold Item</p>
                <p class="text-lg font-800 mt-1 text-black">Cotton Socks</p>
                <p class="text-[10px] text-gray-400">2 Units Sold</p>
            </div>
        </div>

        <div class="stat-card">
            <h3 class="text-xs font-800 text-gray-400 uppercase mb-6 tracking-widest">Top 10 High-Value Customers</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-gray-100">
                            <th class="pb-4 text-[10px] font-800 uppercase text-gray-400">Rank</th>
                            <th class="pb-4 text-[10px] font-800 uppercase text-gray-400">Customer Name</th>
                            <th class="pb-4 text-[10px] font-800 uppercase text-gray-400 text-right">Contribution</th>
                        </tr>
                    </thead>
                    <tbody id="customerTable">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // DATA FOR TIMEFRAMES
        const chartData = {
            '24h': {
                labels: ['12AM', '4AM', '8AM', '12PM', '4PM', '8PM', '11PM'],
                values: [1200, 3500, 2100, 5000, 4200, 8500, 3000],
                total: '₹8,236.52'
            },
            '7d': {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                values: [45000, 32000, 51000, 48000, 62000, 85000, 92000],
                total: '₹4,15,000'
            },
            '30d': {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                values: [120000, 280000, 195000, 310000],
                total: '₹9,05,000'
            }
        };

        const ctx = document.getElementById('mainChart').getContext('2d');
        let myChart;

        function initChart(timeframe) {
            const data = chartData[timeframe];
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(37, 99, 235, 0.15)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        data: data.values,
                        borderColor: '#2563eb', 
                        borderWidth: 3,
                        pointRadius: 5,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#2563eb',
                        pointHoverRadius: 8,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: gradient
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { 
                            enabled: true,
                            backgroundColor: '#000',
                            titleFont: { weight: 'bold' },
                            padding: 12,
                            displayColors: false,
                            callbacks: { label: (item) => ' Sales: ₹' + item.parsed.y.toLocaleString() }
                        }
                    },
                    scales: {
                        y: { grid: { color: '#f3f4f6' }, ticks: { font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function updateTimeframe(time, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('display-revenue').innerText = chartData[time].total;
            initChart(time);
        }

        window.onload = () => {
            initChart('24h');
            const customerData = [
                { name: "John Doe", spent: "₹45,000" },
                { name: "Sarah Malik", spent: "₹38,200" },
                { name: "Arjun Singh", spent: "₹31,000" },
                { name: "Priya Sharma", spent: "₹28,500" },
                { name: "Vikram Rathore", spent: "₹22,100" },
                { name: "Ananya Iyer", spent: "₹19,400" },
                { name: "Rahul Verma", spent: "₹15,000" },
                { name: "Sonia Gupta", spent: "₹14,200" },
                { name: "Amit Patel", spent: "₹12,800" },
                { name: "Deepak Nag", spent: "₹10,500" }
            ];
            const table = document.getElementById('customerTable');
            customerData.forEach((c, i) => {
                table.innerHTML += `<tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                    <td class="py-4 font-800 text-gray-300">#${i+1}</td>
                    <td class="py-4 font-700 text-sm text-gray-800">${c.name}</td>
                    <td class="py-4 text-right font-800 text-black text-sm">${c.spent}</td>
                </tr>`;
            });
        };
    </script>
</body>
</html>
