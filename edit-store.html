<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Store Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .box { 
            background: #0a0a0a; border: 1px solid #222; border-radius: 15px; 
            padding: 15px; width: 100%; color: #fff; margin-bottom: 20px; 
            outline: none; font-weight: 600; font-size: 14px;
            appearance: none; 
        }
        .box:focus { border-color: #22c55e; }
        label { font-size: 10px; font-weight: 900; color: #555; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
    </style>
</head>
<body class="p-8">
    <header class="mb-10">
        <h2 class="text-3xl font-900 uppercase tracking-tighter">Edit Store</h2>
        <p class="text-zinc-500 text-xs font-bold">Update your business and delivery settings.</p>
    </header>

    <form id="editForm">
        <label>Store Name</label>
        <input type="text" id="storeName" class="box" placeholder="Enter Store Name" required>

        <label>UPI ID (For Payments)</label>
        <input type="text" id="upiId" class="box" placeholder="e.g. name@okhdfcbank" required>

        <label>WhatsApp Number</label>
        <input type="tel" id="whatsapp" class="box" placeholder="Your WhatsApp No." required>

        <label>Seller District</label>
        <input type="text" id="sellerDistrict" class="box" placeholder="e.g. Aizawl" required>

        <label>Veng Hming / Colony</label>
        <input type="text" id="vengHming" class="box" placeholder="e.g. Chanmari, Ramhlun South" required>

        <button type="submit" id="saveBtn" class="w-full bg-white text-black font-900 py-4 rounded-2xl uppercase tracking-widest text-sm mt-4">
            Save Changes
        </button>
        
        <button type="button" onclick="window.location.href='store.html'" class="w-full text-zinc-500 font-900 py-4 uppercase text-[10px] mt-2">
            Cancel
        </button>
    </form>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <script>
        // Use 'db' if defined in config.js, otherwise initialize here
        const database = typeof db !== 'undefined' ? db : firebase.firestore();

        firebase.auth().onAuthStateChanged(user => {
            if (user) { 
                loadExistingData(user.uid); 
            } else { 
                window.location.href = "signin.html"; 
            }
        });

        async function loadExistingData(uid) {
            try {
                // Fetch directly from 'user_data' collection
                const doc = await database.collection("user_data").doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('storeName').value = data.storeName || "";
                    document.getElementById('upiId').value = data.upiId || "";
                    document.getElementById('whatsapp').value = data.whatsapp || "";
                    document.getElementById('sellerDistrict').value = data.sellerDistrict || "";
                    document.getElementById('vengHming').value = data.vengHming || "";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        document.getElementById('editForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerText = "SAVING...";
            btn.disabled = true;

            const user = firebase.auth().currentUser;
            if (!user) return;

            const updatedInfo = {
                storeName: document.getElementById('storeName').value.trim(),
                upiId: document.getElementById('upiId').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim(),
                sellerDistrict: document.getElementById('sellerDistrict').value.trim(),
                vengHming: document.getElementById('vengHming').value.trim(),
                lastEdited: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Save directly to 'user_data' collection using User UID
                await database.collection("user_data").doc(user.uid).set(updatedInfo, { merge: true });
                window.location.href = "store.html";
            } catch (error) {
                alert("Error saving: " + error.message);
                btn.innerText = "SAVE CHANGES";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
