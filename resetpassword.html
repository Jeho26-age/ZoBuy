<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobuy - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
        }

        .signin-container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .logo-area {
            width: 100%;
            margin-bottom: 20px;
        }

        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .tagline {
            color: #555;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        form {
            width: 100%;
            margin-top: 20px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        /* Flexbox to put OTP input and Send button on same line */
        .otp-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .otp-row input {
            flex: 2;
        }

        .send-btn {
            flex: 1;
            background-color: #1a4d2e;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 16px 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            font-size: 1.2rem;
            z-index: 10;
        }

        .reset-btn {
            width: 100%;
            padding: 16px;
            background-color: #1a4d2e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background-color: #143d24;
        }

        #error-popup {
            color: #d71920;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="signin-container">
        <div class="logo-area">
            <img src="logo.png" alt="Zobuy Logo" class="logo">
            <p class="tagline">Reset Your Password</p>
        </div>

        <form id="resetForm" action="signin.html" method="GET">
            
            <div class="input-group">
                <input type="text" id="userEmail" placeholder="Gmail or Phone Number" required>
            </div>

            <div class="otp-row">
                <input type="text" id="otp" placeholder="Received Code / OTP" required>
                <button type="button" class="send-btn" onclick="alert('Code Sent!')">Send</button>
            </div>
            
            <div class="input-group password-wrapper">
                <input type="password" id="new_password" placeholder="Enter New Password" required>
                <i class="far fa-eye toggle-btn" onclick="togglePass('new_password', this)"></i>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" id="confirm_password" placeholder="Confirm New Password" required>
                <i class="far fa-eye toggle-btn" onclick="togglePass('confirm_password', this)"></i>
                <div id="error-popup">Passwords do not match</div>
            </div>

            <button type="submit" class="reset-btn">Reset Password</button>
        </form>
    </div>

    <script>
        // Toggle visibility function
        function togglePass(id, icon) {
            const field = document.getElementById(id);
            if (field.type === "password") {
                field.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Logic to check passwords match
        const form = document.getElementById('resetForm');
        form.addEventListener('submit', function(e) {
            const p1 = document.getElementById('new_password').value;
            const p2 = document.getElementById('confirm_password').value;
            const error = document.getElementById('error-popup');

            if (p1 !== p2) {
                e.preventDefault(); 
                error.style.display = 'block';
            }
        });
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="config.js"></script>

<script>
  // Quick test to see if everything is working
  console.log("ZoBuy System: Page successfully connected to config.js");
</script>

</body>
</html>
