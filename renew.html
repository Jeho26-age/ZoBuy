<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan Expired | System Locked</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            margin: 0;
        }
        .expired-card {
            background: linear-gradient(145deg, #0a0a0a 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .glow-red {
            color: #ff3b3b;
            text-shadow: 0 0 20px rgba(255, 59, 59, 0.4);
        }
        .btn-buy {
            background: #fff;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .btn-buy:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="p-6">

    <nav class="flex items-center mb-12">
        <a href="account.html" class="p-2 -ml-2 text-gray-400 hover:text-white transition-colors">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
    </nav>

    <div class="flex-1 flex flex-col justify-center items-center">
        <div class="expired-card w-full max-w-sm">
            <div class="mb-6 flex justify-center">
                <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center border border-red-500/20">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff3b3b" stroke-width="2">
                        <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

            <h1 class="text-2xl font-black mb-4 tracking-tight glow-red uppercase">
                Plan Expired
            </h1>
            
            <p class="text-gray-400 text-sm leading-relaxed mb-10 px-4">
                Your store access has been suspended. Please buy a new plan to continue operating your store and managing inventory.
            </p>

            <a href="gateway.html" class="btn-buy w-full inline-block py-4 rounded-xl text-sm mb-4">
                Buy New Plan
            </a>
            
            <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest">
                Immediate Activation
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="config.js"></script>

    <script>
        // Check if user is actually logged in
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "signin.html";
            }
        });
    </script>

</body>
</html>
