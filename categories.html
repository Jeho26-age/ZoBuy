<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobuy - Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --zobuy-green: #1a4d2e;
            --white: #ffffff;
            --text-gray: #757575;
            --bg-sidebar: #f1f3f6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #eee;
        }
        .header i { color: var(--zobuy-green); cursor: pointer; }
        .search-mini {
            flex: 1;
            background: var(--bg-sidebar);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-gray);
        }

        /* --- LAYOUT --- */
        .category-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR FIX */
        #sidebar {
            width: 100px;
            background-color: var(--bg-sidebar);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .side-item {
            padding: 20px 5px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-gray);
            cursor: pointer;
            border-left: 4px solid transparent;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .side-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .side-item.active {
            background-color: var(--white);
            color: var(--zobuy-green);
            border-left: 4px solid var(--zobuy-green);
        }

        /* GRID CONTENT FIX */
        .content-panel {
            flex: 1;
            background-color: var(--white);
            overflow-y: auto;
            padding: 20px;
        }

        #panel-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 25px; 
            color: #000;
        }

        .subcategory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 15px;
        }

        .sub-item {
            text-align: center;
            text-decoration: none;
            color: #333;
            display: block;
            cursor: pointer;
        }

        .sub-img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #fdfdfd;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .sub-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sub-item span { 
            font-size: 11px; 
            font-weight: 600; 
            display: block;
            line-height: 1.2;
            word-wrap: break-word;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            background: var(--zobuy-green);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-radius: 15px 15px 0 0;
        }

        .nav-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 11px;
            flex: 1;
        }

        .nav-link i { display: block; font-size: 22px; margin-bottom: 4px; }
        .nav-link.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="history.back()"></i>
        <div class="search-mini">Search in categories</div>
    </div>

    <div class="category-wrapper">
        <div id="sidebar"></div>
        <div class="content-panel">
            <div id="panel-title">Categories</div>
            <div class="subcategory-grid" id="subcategory-grid"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="homepage.html" class="nav-link"><i class="fa fa-home"></i>Home</a>
        <a href="categories.html" class="nav-link active"><i class="fa fa-th-large"></i>Categories</a>
        <a href="account.html" class="nav-link"><i class="fa fa-user-circle"></i>Account</a>
        <a href="cart.html" class="nav-link"><i class="fa fa-shopping-cart"></i>Cart</a>
    </nav>

    <script src="categories-data.js"></script>
    <script>
        const sidebarEl = document.getElementById('sidebar');
        const gridEl = document.getElementById('subcategory-grid');
        const titleEl = document.getElementById('panel-title');

        /**
         * UPDATED: Navigates to homepage using the full category path.
         * Since your database saves items as "Main Category - Subcategory",
         * we must pass the same full string for the filter to work.
         */
        function handleSubClick(mainName, subName) {
            const fullPath = mainName + " - " + subName;
            window.location.href = "homepage.html?filter=" + encodeURIComponent(fullPath);
        }

        function renderSubCategories(index) {
            const category = categoryData[index];
            titleEl.innerText = category.name;
            gridEl.innerHTML = ""; 

            category.subs.forEach(sub => {
                const item = document.createElement('div');
                item.className = "sub-item";
                // Pass both parent name and sub name to create the match
                item.onclick = () => handleSubClick(category.name, sub.name);
                
                item.innerHTML = `
                    <div class="sub-img-box">
                        <img src="${sub.img}" alt="${sub.name}" onerror="this.src='https://via.placeholder.com/100?text=${sub.name}'">
                    </div>
                    <span>${sub.name}</span>
                `;
                gridEl.appendChild(item);
            });
        }

        function renderSidebar() {
            sidebarEl.innerHTML = "";
            categoryData.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = `side-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <img src="${cat.sidebarImg}" class="side-img" onerror="this.src='https://via.placeholder.com/50?text=IMG'">
                    <span>${cat.name}</span>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
                    div.classList.add('active');
                    renderSubCategories(index);
                };
                sidebarEl.appendChild(div);
            });
        }

        if (typeof categoryData !== 'undefined') {
            renderSidebar();
            renderSubCategories(0);
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

</body>
</html>
